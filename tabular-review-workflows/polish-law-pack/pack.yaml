id: "polish-law"
title: "Polish Law Tabular Reviews"
description: "Tabular review workflows for contracts governed by Polish law. Column prompts are in Polish and tuned to Polish contract practice and due diligence: contractual penalties (kara umowna, Art. 483 of the Polish Civil Code), forum selection and arbitration clauses, GDPR data processing agreements (Art. 28), security instruments (promissory note, surety, pledge, mortgage, bank guarantee), and Polish entity identifiers (KRS, NIP). The prompts come from PATRON, the publisher's open-source desktop application for Polish law firms."
