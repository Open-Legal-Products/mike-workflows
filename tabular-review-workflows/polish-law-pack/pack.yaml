$schema: "../../workflow-schema/pack.schema.yaml"
id: "polish-law"
title: "Polish Law Tabular Reviews"
description: "Tabular review workflows for Polish legal documents: commercial contracts governed by Polish law under the Civil Code (Kodeks cywilny), Polish employment contracts (umowa o pracę) under the Labour Code (Kodeks pracy), and Polish residential leases (umowa najmu lokalu mieszkalnego) under the Civil Code and the Tenant Protection Act (ustawa z dnia 21 czerwca 2001 r. o ochronie praw lokatorów). Column prompts are in Polish. In the employment and lease workflows each column also records the statutory position next to the contractual term, so a reviewer sees where an agreement departs from it."
publisher:
  name: "MateMatic Solutions"
  url: "https://matematicsolutions.com"
license: "MIT"
version: "1.1.0"
jurisdiction: "Poland"
source:
  repo: "https://github.com/matematicsolutions/patron"
  path: "frontend/src/app/components/tabular/columnPresets.ts"
  url: "https://matematicsolutions.com"
workflows:
  - "polish-contract-tabular-review"
  - "polish-employment-contract-tabular-review"
  - "polish-residential-lease-tabular-review"
