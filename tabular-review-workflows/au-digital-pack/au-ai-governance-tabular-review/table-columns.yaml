$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Applicable Instrument Mix
  format: tag
  tags:
  - 'Guidance for AI Adoption — verify current status'
  - 'Voluntary AI Safety Standard — verify current status'
  - 'Binding: Privacy Act 1988 (Cth) / APPs'
  - 'Binding: ACL — misleading or deceptive conduct (s 18)'
  - 'Binding: Anti-discrimination law (Cth/state)'
  - 'Binding: eSafety online-safety obligations'
  - 'Binding: Sector regulator (ASIC/APRA/TGA/other)'
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine which Australian instruments apply and their force to the evidenced AI use. Identify and cite the current official Guidance for AI Adoption, Voluntary AI Safety Standard and Australia’s AI Ethics Principles from ai.gov.au or industry.gov.au, including title, dated version, relevant passage and current relationship/supersession status. Do not assume a fixed supersession date or an exhaustive six-practice list. Determine applicable Privacy Act, ACL, anti-discrimination, online-safety and sector obligations separately. For ACL ss 18 and 29, identify and cite the relevant current Schedule 2 passages of the Competition and Consumer Act 2010 from legislation.gov.au before characterising their tests; do not infer application from an Act title. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 1
  name: System Description & Australian Nexus
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Describe the AI system: purpose, model type, level of autonomy and human oversight in place, training/deployment approach, and the Australian nexus — offered to Australian users, uses Australians' personal information, operated by an Australian entity, or otherwise connected to Australia. State whether the organisation is a provider, deployer, or both under the Australian guidance's framing, and identify which existing legal definitions the system engages (e.g. APP entity, 'personal information'). Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 2
  name: Accountability & Governance Practice
  format: tag
  tags:
  - Named accountable owner + documented governance framework
  - Accountable owner exists, framework partial or informal
  - Governance diffuse — no single accountable owner
  - Third-party model provider governs; deployer has no own framework
  - Under development — governance being stood up
  - None evident from materials
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Establish accountability and record-keeping expectations from the identified current official AI guidance. Compare named accountable roles, governance framework coverage and responsibility across developers, deployers and providers against supplied ownership and governance records. Identify and cite the current official Guidance for AI Adoption, Voluntary AI Safety Standard and Australia’s AI Ethics Principles from ai.gov.au or industry.gov.au, including title, dated version, relevant passage and current relationship/supersession status. Do not assume a fixed supersession date or an exhaustive six-practice list. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 3
  name: Essential-Practices Coverage Map
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Map accountability, risk and benefit, meaningful human oversight, data fitness/protection, user transparency, and testing/monitoring/documentation as provisional topics to establish from current guidance. Identify the actual practice headings, coverage and relevant passages before mapping each to supplied evidence and gaps. Identify and cite the current official Guidance for AI Adoption, Voluntary AI Safety Standard and Australia’s AI Ethics Principles from ai.gov.au or industry.gov.au, including title, dated version, relevant passage and current relationship/supersession status. Do not assume a fixed supersession date or an exhaustive six-practice list. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 4
  name: Risk & Benefit Management
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine risk-management expectations from current identified guidance. Compare supplied benefit/risk registers, risk appetite, documented decisions, escalation triggers and controls. Assess system-specific inaccurate-output, discrimination, over-reliance and misuse risks using explicit rating criteria. Proposed controls or risk decisions are not deployed or accepted controls. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 5
  name: Meaningful Human Oversight
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine oversight expectations from current identified guidance rather than an assumed numbered practice. Compare supplied workflow designs, reviewer competence/training, override authority, fallback procedures and test results. Assess whether evidence supports intervention before irreversible harm; do not infer effectiveness from a design statement. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 6
  name: Data Governance & Privacy Act Compliance
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Analyse evidenced training/inference collection, use and disclosure against the Privacy Act and APPs, including APP 1–5, APP 6 and APP 11. Assess existing privacy-policy duties under APP 1.3–1.5. Treat the dedicated automated-decision privacy-policy amendments in Schedule 1 Part 15 of the Privacy and Other Legislation Amendment Act 2024 as commencing on 10 December 2026, not as current APP 1.4 duties. Assess the APP 1.4 privacy-policy information about how an individual can complain and how the entity will deal with the complaint. Assess requested copies separately under APP 1.6. Distinguish current identified OAIC guidance and voluntary data-quality/minimisation/provenance expectations from binding duties. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 7
  name: Consumer Law & Misleading Conduct Exposure
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess consumer-law exposure of supplied AI outputs, user-facing claims and accuracy warranties. Identify and cite the current Schedule 2 ACL ss 18, 29 and 33 passages from the Competition and Consumer Act 2010 on legislation.gov.au; determine the particular test and application rather than assuming all concern false representations. Analyse third-party-output exposure and propose disclaimers, limits or human-review mitigations without treating them as proven defences. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 8
  name: Anti-Discrimination & Fairness Exposure
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess bias and discrimination risk under current applicable Racial Discrimination Act 1975 (Cth), Sex Discrimination Act 1984 (Cth), Disability Discrimination Act 1992 (Cth), Age Discrimination Act 2004 (Cth) and identified state/territory equivalents. Determine covered decisions, areas, indirect-discrimination tests and defences from pinpoint authority and supplied impact/testing evidence. Ask whether an AI-specific liability provision applies to this use and jurisdiction, with current cited authority; state unresolved scope rather than asserting absence. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 9
  name: Transparency & User-Facing Disclosures
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine user-facing transparency expectations from current identified AI guidance, existing APP duties, cited OAIC guidance and applicable sector rules. Assess existing privacy-policy duties under APP 1.3–1.5. Treat the dedicated automated-decision privacy-policy amendments in Schedule 1 Part 15 of the Privacy and Other Legislation Amendment Act 2024 as commencing on 10 December 2026, not as current APP 1.4 duties. The Privacy Act does not impose a universal PIA requirement. Agencies covered by the Privacy (Australian Government Agencies — Governance) APP Code 2017 must conduct a PIA for all high privacy risk projects. Assess whether that Code applies; otherwise use OAIC guidance to determine whether a PIA is warranted. Assess supplied disclosure wording, accessibility and user-testing evidence; label proposed disclosures and legal-exposure assessments. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 10
  name: Testing, Monitoring & Documentation Evidence
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine testing, monitoring and documentation expectations from current identified guidance. Assess supplied pre-deployment test reports, monitoring evaluations, incident/performance logs and governance decisions. Identify missing artefacts and explain evidence-based review priorities; do not predict what a regulator or court would most likely request without authority. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 11
  name: Security & Critical-Technology Considerations
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine security expectations from current identified AI guidance. For any ASD technical guidance, first identify the exact official original publication, title, date/version and relevant passage; if no approved-source publication is supplied or established, mark that guidance assessment Not assessed rather than asserting unnamed requirements. Review supplied training-data/model-weight protections, adversarial and prompt-injection testing and monitoring. Where relevant determine application of the Defence Trade Controls Act 2012, foreign-investment and critical-infrastructure rules from current pinpoint authority; otherwise give an evidenced Not applicable or unresolved-scope finding. Identify and cite the current official Guidance for AI Adoption, Voluntary AI Safety Standard and Australia’s AI Ethics Principles from ai.gov.au or industry.gov.au, including title, dated version, relevant passage and current relationship/supersession status. Do not assume a fixed supersession date or an exhaustive six-practice list. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 12
  name: Gap Analysis & Remediation Plan
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Compare evidenced practice against current guidance and binding Australian law. List each supported gap, legal or voluntary class, evidence-based severity, documented owner or proposed owner, proposed remediation and labelled effort estimate. Identify unresolved go-live risks; do not approve deployment or accept residual risk. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 13
  name: Regulatory Trajectory Watch
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine the current official regulatory pipeline relevant to this system without assuming a government preference or inevitable soft-law hardening. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. Cite current official policy/consultation documents. Label impact and any timing forecast as assessment, not an enacted duty or discovered date. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 14
  name: Confidence & Open Questions
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. State evidence-based confidence for instrument application, established guidance coverage and legal exposures. Identify missing engineering/governance inputs and unresolved authority/version questions. Identify and cite the current official Guidance for AI Adoption, Voluntary AI Safety Standard and Australia’s AI Ethics Principles from ai.gov.au or industry.gov.au, including title, dated version, relevant passage and current relationship/supersession status. Do not assume a fixed supersession date or an exhaustive six-practice list. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. Use supplied system/model documentation, governance/owner records, full policies, user disclosures, risk/sign-off records, training, test reports, monitoring and incident evidence; identify unavailable artefacts. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."
