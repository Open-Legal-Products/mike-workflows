$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Document & Flow Identification
  format: text
  prompt: 'Identify the documents and flows under review: APP Privacy Policy version and date, collection notices at each touchpoint (web, app, account creation, in-person, third-party collection), and any consent mechanisms. Confirm the entity is an APP entity with an Australian link (s 5B) and not a small-business operator relying on the s 6D exemption (verify the exceptions — health service providers, trading in personal information, related bodies corporate, etc.). Flag any notice drafted on a GDPR model without adaptation to the APPs (e.g. asserting ''consent'' as the basis for ordinary collection, or claiming erasure rights the Act does not provide).'
- index: 1
  name: Privacy Policy Content (APP 1)
  format: text
  prompt: 'Assess the APP Privacy Policy against APP 1.4: does it clearly express the entity''s policies on the management of personal information, including the kinds of information collected and held, how it is collected and held, the purposes of collection, use and disclosure, how an individual may access and seek correction (APP 1.4(g)), how they may complain about a breach (APP 1.4(h)), whether the entity is likely to disclose to overseas recipients and the countries involved (APP 1.4(i)), and whether the policy is current, readily available and in plain language? State which APP 1.4 matters are missing or inaccurate against actual practice.'
- index: 2
  name: Collection Notification (APP 5)
  format: text
  prompt: 'Assess each APP 5 collection notice: does it notify (at or before collection, or as soon as practicable after) the matters in APP 5.2 — the entity''s identity and contact details, that collection has occurred or is occurring, the purposes of collection, the main consequences (if any) of not providing the information, the main third parties or types of third parties to which it discloses personal information, access/correction and complaint mechanisms, and whether disclosure to overseas recipients is likely, with the countries involved where practicable? Assess timing and accessibility at each collection point and flag collections with no notice at all.'
- index: 3
  name: Collection Rules & Lawfulness (APP 3)
  format: text
  prompt: 'For each collection, assess APP 3 compliance: whether the information is reasonably necessary for one or more of the entity''s functions or activities (APP 3.1/3.2 — an objective test, not the entity''s convenience), whether collection is only by lawful and fair means and not unreasonably intrusive (APP 3.5), whether collection is direct from the individual except where an exception applies (APP 3.6), and whether solicited sensitive information is collected only with consent (APP 3.3(a)) or under an exception (APP 3.4). Flag collection that is excessive for the stated function or relies on unchecked assumptions.'
- index: 4
  name: Use & Disclosure Basis (APP 6)
  format: text
  prompt: 'For each use and disclosure, identify the APP 6 basis: within the primary purpose of collection, within a related secondary purpose the individual would reasonably expect (APP 6.2(a) — with sensitivity and context raising the bar), or within a permitted general situation (APP 6.2(b), including consent, required-or-authorised-by-law, and the health/safety situations in s 16A). Assess the reasoning for each secondary purpose explicitly — especially data sharing with affiliates, advertising and analytics partners — and flag uses and disclosures that lack a defensible APP 6 basis or rely on a stretched ''reasonably expect'' argument.'
- index: 5
  name: Consent Mechanics & Sensitive Information
  format: text
  prompt: 'Where the flow relies on consent (primarily for sensitive information under APP 3.3(a), or where the entity chooses consent as its basis), assess whether consent is valid under OAIC''s approach: informed (the individual understands what they are consenting to), voluntary (no coercion or material detriment for refusal), current and specific, and evidenced. Assess whether opt-in defaults are used for sensitive categories and whether the flow makes refusal a real option. Note that the Privacy Act does not define consent exhaustively — apply OAIC guidance and the case law on informed, voluntary consent.'
- index: 6
  name: Third-Party Disclosures & Sharing
  format: text
  prompt: 'Assess how notices and the APP 6 analysis handle third-party disclosures: are recipients or recipient types disclosed in the policy and collection notices with enough specificity, and is each disclosure (service providers, group companies, advertising, government) supported by an APP 6 basis? Distinguish disclosures to contracted service providers that act for the entity (still APP 6-analyzed as disclosures; the entity remains accountable) from independent recipients. Flag undisclosed recipient categories and ''may share with partners'' boilerplate that hides the real recipients.'
- index: 7
  name: Cross-Border Disclosure Transparency (APP 8)
  format: text
  prompt: 'Assess how the notices handle overseas disclosure: does the policy and collection notice disclose that overseas recipients are likely and identify the countries involved (APP 1.4(i), APP 5.2(j)), and does actual practice match? State whether the entity takes reasonable steps to ensure recipients comply with the APPs (APP 8.1) or relies on an APP 8.2 exception (including the consent exception where the individual is told the recipient is not required to comply with the APPs — the notice must actually say this for the exception to operate). Flag notices that disclose transfers vaguely or not at all while transfers occur.'
- index: 8
  name: Access, Correction & Complaint Mechanics
  format: text
  prompt: 'Assess the rights architecture as disclosed and operationalised: APP 12 access (a mechanism for individuals to request access, responded to within a reasonable period, with the permitted exceptions applied correctly), APP 13 correction (including notifying recipients of corrections where practicable), and the APP 1.6 complaint mechanism (how individuals complain, how the entity responds, and the OAIC route if unresolved). State whether the disclosed channels work in practice and whether response processes would meet OAIC''s expectations of timeliness and transparency.'
- index: 9
  name: Marketing & Direct-Messaging Practices
  format: text
  prompt: 'Assess marketing and direct-messaging practices: the APP 6 basis for marketing uses (primary purpose where the individual provided data for that purpose, or a defensible secondary purpose), the operation of the Spam Act 2003 (Cth) for electronic messages (consent requirements, unsubscribe obligations) where it applies alongside the Privacy Act, and the Do Not Call Register Act 2006 (Cth) for telemarketing where relevant. State whether the notice discloses marketing purposes and whether unsubscribe/opt-out routes are visible and functional.'
- index: 10
  name: Children, Sensitive Data & Vulnerable Groups
  format: text
  prompt: 'Where flows involve children, sensitive information, or vulnerable groups, assess the heightened expectations: OAIC''s guidance on children''s privacy (capacity to consent, age-appropriate communication), the stricter APP 3.3 consent requirement for sensitive information, and any sector overlays (health, credit reporting under Part IIIA). State whether the notice and consent approach would withstand OAIC scrutiny for these groups, including whether design choices (dark patterns, pre-ticked boxes) undermine valid consent.'
- index: 11
  name: Automated-Decision Transparency
  format: text
  prompt: Assess whether the notices disclose automated decision-making involving personal information, in line with current OAIC expectations (the OAIC has taken the position that APP 5 purposes disclosure should cover automated decisions where collection feeds them) and the Privacy Act reform trajectory (proposals to require explicit notice of automated decisions that affect individuals, plus related transparency rights). State what the notice currently says, what it should say under current guidance, and what the reform pipeline would require if enacted.
- index: 12
  name: Clause-by-Clause Redline
  format: text
  prompt: 'Produce a clause-by-clause review of the notice texts: for each clause, quote it, state the APP/OAIC issue it raises, its severity (critical APP breach / material risk / drafting improvement), and a concrete redline suggestion, preserving the document''s numbering. Where a clause is compliant, say so briefly with the reason, so the review is a complete audit. Where a clause asserts a GDPR concept that the APPs do not require (e.g. mandatory erasure, consent for all cookies-type processing), flag the mismatch and the correct APP treatment.'
- index: 13
  name: Consent-Flow & User-Journey Walkthrough
  format: text
  prompt: 'Walk through each collection and consent flow end-to-end as an Australian user would experience it: what the user sees at each step, where the collection notice appears relative to collection, whether consent screens (where used) are designed without dark patterns, and whether choices are genuinely available. Identify steps that would fail OAIC''s expectations of transparency and fairness or attract regulator or community criticism.'
- index: 14
  name: Gap Analysis & Remediation Plan
  format: text
  prompt: 'Consolidate findings into a remediation plan: each gap with severity (critical — APP breach likely; material — OAIC complaint or investigation risk; minor — hygiene), the APP provision engaged, the owner, the fix, and a target date. Prioritise live-flow gaps (missing collection notices, undisclosed secondary uses, unassessed overseas disclosures) over policy polish. State any gap requiring product or architecture decisions and any item the Privacy Act reform pipeline will force regardless.'
- index: 15
  name: Confidence & Open Questions
  format: text
  prompt: 'State confidence (high/medium/low) for each finding. List open questions: facts needed from the business (actual flows, recipients, overseas destinations), OAIC positions that may have evolved (verify against OAIC''s current guides), and the current status of Privacy Act reform items that would change the analysis (verify against the Federal Register of Legislation and the AGD/OAIC pages). Where a provision or guidance is checkable, verify before answering; otherwise mark explicitly. Do not import GDPR standards as APP requirements.'
