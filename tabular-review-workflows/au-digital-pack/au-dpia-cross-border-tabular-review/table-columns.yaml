columns:
- index: 0
  name: Privacy Act Application & Entity Mapping
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine whether the Privacy Act applies and map APP-entity/accountable roles for each supplied flow. Assess Australian link under s 5B(2)–(3). For an overseas organisation not covered by s 5B(2), assess whether it carries on business in Australia or an external Territory. Do not treat collection of personal information in Australia as a standalone Australian-link test. Determine organisation and small-business-operator status under s 6D and all relevant exceptions from current authority and supplied entity/turnover/activities evidence; do not assume exemption or coverage. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 1
  name: Processing Inventory & APP Basis
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Describe evidenced purposes, personal/sensitive information categories under s 6, individuals, volumes, sources, retention and destruction. Determine collection under APP 3, sensitive-information consent/exception under APP 3.3–3.4 and use/disclosure under APP 6.2, including the directly related test for sensitive information, from the full applicable provisions. Do not treat APP 1 as a collection basis. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 2
  name: PIA Necessity & OAIC Alignment
  format: tag
  tags:
  - PIA warranted — high-risk / novel project per OAIC guidance
  - PIA exists and follows OAIC PIA process
  - PIA exists but outdated or incomplete
  - PIA not warranted — routine, low-risk processing
  - Sector or contract requires PIA
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. The Privacy Act does not impose a universal PIA requirement. Agencies covered by the Privacy (Australian Government Agencies — Governance) APP Code 2017 must conduct a PIA for all high privacy risk projects. Assess whether that Code applies; otherwise use OAIC guidance to determine whether a PIA is warranted. Establish current Code registration/version and cl 12 from official OAIC/Federal Register sources. Compare supplied PIA scope, date, flow mapping, APP evaluation, mitigations and review evidence with current identified OAIC PIA guidance; do not presume a PIA exists or is approved. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 3
  name: Cross-Border Disclosure Analysis (APP 8)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine each evidenced overseas disclosure, APP 8.1 reasonable steps and any applicable exception using current OAIC guidance and statutory conditions. For APP 8.2(a), assess the reasonable belief that the recipient is subject to a substantially similar protective law or binding scheme and that the individual can access mechanisms to enforce that protection. For APP 8.2(b), assess express informed consent after telling the individual that APP 8.1 will not apply to the disclosure. Verify the full conditions of any other exception, including APP 8.2(c)–(d), before relying on it. Cite supplied contracts, recipient protections and testing evidence separately from proposed safeguards. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 4
  name: Destination-Country & Recipient Assessment
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess evidenced destinations and recipients, protective law/binding schemes, accessible enforcement mechanisms, capacity, contractual protections and government-access risks. For APP 8.2(a), assess the reasonable belief that the recipient is subject to a substantially similar protective law or binding scheme and that the individual can access mechanisms to enforce that protection. For APP 8.2(b), assess express informed consent after telling the individual that APP 8.1 will not apply to the disclosure. Distinguish evidence of completed assessment and deployed measures from proposed contractual/technical measures. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 5
  name: Notification & Transparency (APP 1 & 5)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess existing APP 1 privacy-policy and APP 5 collection-notification duties from their full current conditions, including timing, reasonable steps and overseas-country disclosure where practicable. Compare supplied notice versions and flow evidence; do not replace country requirements with categories without authority. Assess existing privacy-policy duties under APP 1.3–1.5. Treat the dedicated automated-decision privacy-policy amendments in Schedule 1 Part 15 of the Privacy and Other Legislation Amendment Act 2024 as commencing on 10 December 2026, not as current APP 1.4 duties. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 6
  name: Use & Disclosure Limits (APP 6)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess APP 6 compliance for each use and disclosure: whether use/disclosure is within the primary purpose, within a related secondary purpose the individual would reasonably expect (with sensitivity of the information raising the bar), or within a permitted situation in APP 6.2 (including consent, health and safety situations, or required by law). Analyse the secondary-purpose reasoning explicitly for any data sharing with affiliates, analytics vendors or advertising partners, and identify disclosures that lack a defensible APP 6 basis. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 7
  name: Security & NDB Scheme Readiness
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess APP 11 (security) compliance — reasonable steps to protect personal information from misuse, interference, loss, unauthorised access, modification or disclosure — and readiness for the Notifiable Data Breaches scheme (Part IIIC): the entity's capability to assess whether an eligible data breach has occurred (unauthorised access/disclosure/loss likely to result in serious harm), and to notify the OAIC and affected individuals under the NDB timeline where required. Assess breach detection for data held by overseas processors and cloud providers. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 8
  name: Access, Correction & Deletion Obligations
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess APP 12 access, APP 13 correction and APP 11.2 destruction/de-identification using each provision’s full current conditions, exceptions and entity-specific timing. Compare supplied request procedures, test results, vendor-copy and retention evidence. Determine any applicable erasure right from current law rather than asserting a universal absence. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 9
  name: Sensitive Information Handling
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine sensitive-information collection requirements and exceptions under APP 3.3–3.4, directly related secondary-purpose tests, security and NDB serious-harm requirements from current authority. Identify the exact current state/territory health, My Health Records or Part IIIA instrument and applicable provisions before assessing stricter overlays. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 10
  name: Risk Register & Mitigations
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Populate the PIA risk register in OAIC terms: risks to individuals from the project and from each overseas disclosure (identity theft, discrimination, embarrassment, financial harm, loss of control), likelihood and consequence ratings, existing controls, and residual risk. For each risk above the acceptable level state the mitigation (technical, organisational, contractual, localisation) and its status. Distinguish APP-compliance risk from reputational and community-expectation risk. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 11
  name: Accountability, Documentation & Governance
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess supplied complete PIA and sign-off records, policy/notice versions, vendor/transfer documentation, NDB plans and training evidence. Assess the APP 1.4 privacy-policy information about how an individual can complain and how the entity will deal with the complaint. Assess requested copies separately under APP 1.6. Cite internal complaints procedures and test evidence separately; missing sign-off or records are Not found, not inferred regulator-request priorities. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 12
  name: Privacy-Reform Pipeline Watch
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine the current status of each relevant privacy-reform item, including serious-invasion tort, overseas-recipient accountability, automated-decision transparency and children’s privacy. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. Assess source-backed effects and transitional provisions; label possible future impacts as assessments, not inevitable obligations. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 13
  name: Gap Analysis & Remediation Plan
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Propose remediation for evidenced gaps, with the applicable APP provision, explicit likelihood/consequence and deadline criteria, evidenced owner or proposed owner, interim measures and target date marked as proposal. Prioritise by supported exposure and urgency rather than assumed investigation likelihood; architectural changes require human approval. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 14
  name: Sign-Off, Review Triggers & Residual Risk
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Record only evidenced PIA sign-off, approving roles, dates and residual-risk acceptance from supplied approval records. Missing approval or acceptance is Not found. Propose review triggers for changed processing, recipients, law/guidance and incidents; cite any prescribed review period or label a suggested cadence as proposal. Humans alone approve deployment and accept residual risk. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 15
  name: Confidence & Open Questions
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. State confidence for APP 8 analysis, APP 6 basis and critical gaps. Identify missing flow, recipient, control and approval evidence. The Privacy Act does not impose a universal PIA requirement. Agencies covered by the Privacy (Australian Government Agencies — Governance) APP Code 2017 must conduct a PIA for all high privacy risk projects. Assess whether that Code applies; otherwise use OAIC guidance to determine whether a PIA is warranted. Verify current Code version/registration and cl 12 before applying it. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. Use supplied full PIA, entity records, flow/inventory maps, recipient contracts/assessments, policy/notices, security and rights-process tests, risk registers, documented owners and sign-off/acceptance records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."
