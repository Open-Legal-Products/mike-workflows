$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Consultation Identification
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Identify the consultation precisely: issuing body (exact name — eSafety Commissioner, ACMA, AGD, OAIC, the issuing Commonwealth department, another department or agency), paper title exactly as published, publication date, reference number if any, response deadline and submission channel (online portal, email, submissions register), and the instrument or policy the consultation feeds (Bill, legislative instrument, registered industry code or standard, guidance, framework). Verify the deadline and channel against the official page; if the deadline has passed or is unknown, say so and ask whether to proceed on a best-efforts basis. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 1
  name: Issuing-Body Verification
  format: tag
  tags:
  - eSafety Commissioner consultation
  - ACMA consultation
  - AGD / Commonwealth department consultation
  - OAIC consultation
  - Commonwealth AI/Technology Department Consultation
  - Issuing body unclear or mismatched — verify before drafting
  - Statutory or Policy Consultation — Verify Basis
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine the actual issuer from the official paper/page; flag a task-label mismatch only if established. Determine statutory versus policy consultation, legal process, confidentiality and publication rules from cited authority; do not presume a task naming ACMA means eSafety. The six additional age-restricted-material codes were registered on 9 September 2025 and commenced from 9 March 2026, with some measures commencing later. Identify the applicable service’s code or standard and each relevant measure’s commencement date; do not assume every measure applied on 9 March 2026. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 2
  name: Consultation Type & Legal Consequence
  format: tag
  tags:
  - Industry code registration / variation consultation
  - Industry standard consultation
  - Legislation reform consultation (Bill / exposure draft)
  - Guidance / framework consultation
  - Outcome binds covered industry participants
  - Outcome is guidance / policy direction only
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine the consultation type, proposed instrument and source-backed legal consequences. Distinguish proposed outcomes, existing code/standard duties and guidance; establish enforcement mechanism, scope and dates before stating an outcome binds the organisation. Identify evidenced parallel engagement separately. The six additional age-restricted-material codes were registered on 9 September 2025 and commenced from 9 March 2026, with some measures commencing later. Identify the applicable service’s code or standard and each relevant measure’s commencement date; do not assume every measure applied on 9 March 2026. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 3
  name: Question Reference Extraction
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Extract every question, numbered item, or request-for-comment point in the consultation paper, preserving the issuer's exact numbering and quoting the text. For each, state its topic, the section or schedule it responds to (e.g. a specific clause of a draft code schedule), and whether it is a directed question or an open invitation for views. Do not merge or renumber the issuer's questions; where the paper has no numbered questions, list issues by section and paragraph reference. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 4
  name: Stakeholder Position & Interest
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. For each question, state the organisation's interest: which products, users, or operations the issue affects (in Australian regulatory terms — e.g. service class under the Online Safety Act, carrier obligations, APP entity), whether the organisation supports, opposes, or seeks modification, and the strength of the position (core red-line vs flexible). Separate commercial from compliance interests and flag internal conflicts, including positions inconsistent with Australian user-safety expectations or prior public commitments. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 5
  name: Issue & Option Analysis
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. For each position, set out the reasoned analysis: the problem the consultation seeks to address, the options presented (regulatory, co-regulatory code, standard, no change), the trade-offs of each (cost, effectiveness, enforceability, impact on users and industry), and the organisation's recommended option with justification grounded in the paper's own framing and the organisation's evidence. Address counterarguments a regulator would raise, including consistency across the industry and the risk that a weak code invites a regulator-made standard. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 6
  name: Legal & Regulatory Authority Map
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. For each position, cite supporting or constraining current Australian authority with pinpoint references. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law. Determine applicable Online Safety Act/BOSE provisions, code/standard duties, ACMA rules and OAIC guidance from their actual text; label comparative sources separately. The Privacy Act does not impose a universal PIA requirement. Agencies covered by the Privacy (Australian Government Agencies — Governance) APP Code 2017 must conduct a PIA for all high privacy risk projects. Assess whether that Code applies; otherwise use OAIC guidance to determine whether a PIA is warranted. The six additional age-restricted-material codes were registered on 9 September 2025 and commenced from 9 March 2026, with some measures commencing later. Identify the applicable service’s code or standard and each relevant measure’s commencement date; do not assume every measure applied on 9 March 2026. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 7
  name: Evidence & Data Support
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Identify the evidence the organisation can marshal for each position: Australian user and safety metrics, complaint-handling data, technical feasibility and cost analysis, incident data, and records of prior engagement with the regulator (including participation in earlier code development rounds). For each piece, state the source, whether it can be published in the submission or should be a confidential annex (and the agency's confidentiality practice), and whether it is strong enough to carry the position. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 8
  name: Response Structure & Drafting Plan
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Plan the response document: cover note (organisation, contact, confidentiality election, public-submission consent), executive summary of positions, question-by-question or clause-by-clause responses preserving the issuer's numbering, confidential annexes, and any statutory forms or templates the process requires. State the drafting conventions (position first, concise reasoning, plain English, concrete drafting suggestions where the organisation proposes a change), the internal approval chain, and the production timeline working back from the deadline. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 9
  name: Draft Response Content
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Draft the actual response content in the voice of the organisation's regulatory counsel: clear position per question, concise reasoning with cited authority, suggested drafting changes expressed concretely (proposed clause wording or principle), and acknowledgement of counterarguments. Where the organisation has no position or insufficient information, say so honestly with the reason. Flag every factual assertion requiring verification before submission, and keep language calibrated for a regulator that can register a code the organisation must live under. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 10
  name: Tone & Relationship Considerations
  format: tag
  tags:
  - Constructive engagement — ongoing regulator relationship
  - First-time submission
  - Contested / standard-making risk context
  - Supportive submission
  - Critical submission (opposes or seeks major change)
  - Balanced — support in part, seek modification in part
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess the regulatory-relationship context: ongoing engagement with eSafety/ACMA/OAIC (including existing code-compliance relationship), first-time submission, or a contested context (e.g. responding where a standard may be made because industry did not deliver a workable code). Tag the posture the draft should take and state language to avoid (unsubstantiated claims, refusal-to-engage signals) and signals to include (support for regulatory objects like child safety, offers to participate in implementation or assurance work, evidence of good-faith effort). Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 11
  name: Consistency & Cross-Check
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Cross-check only the supplied complete draft, identified prior submissions, public statements, regulatory filings and related consultation drafts. Cite each compared version and passage. Return Not assessed for unavailable comparisons; propose resolutions for human approval rather than silently changing established organisational positions. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 12
  name: Risk & Sensitivity Review
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Review the draft for risk: commercially sensitive content for confidential annexes, legal admissions that could be used in later enforcement or litigation (e.g. statements about the organisation's current compliance gaps), positions that contradict existing Australian legal obligations, and reputational risk from the public submissions register. Identify sentences requiring a second-lawyer review and any statement that could be read as an admission of non-compliance with a registered code or the basic online safety expectations. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 13
  name: Submission Mechanics & Record
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Propose submission mechanics: format, naming, verified official channel and deadline, confidentiality/public-disclosure election, supplied approval evidence and records to retain (final version, sign-off, timestamp/channel and receipt). Distinguish evidenced submitting owner, consent and backstop time from proposals; missing approval, consent or receipt is Not found. Stop at a draft plan; humans approve and submit. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 14
  name: Post-Submission Monitoring
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Propose monitoring and follow-up using current official decisions and supplied positions. Label proposed owner, cadence, trigger and engagement plan. Determine whether a final instrument applies before proposing obligation-map changes; do not contact the regulator or submit, publish or implement changes. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 15
  name: Confidence & Open Questions
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. State confidence (high/medium/low) for the question extraction, each position's authority, and the drafting. List open questions requiring verification: the consultation's actual deadline and channel, the current text of the Act or instrument the response relies on, and factual assertions needing business confirmation. Where a statute, code, or consultation status is checkable against an official Australian source (Federal Register of Legislation, eSafety register, agency site), verify before answering; otherwise flag explicitly. Note any mismatch between the regulator named in the task and the actual issuing body. Use the official paper plus supplied complete drafts, approved positions, prior submissions/filings, metrics, cost/technical evidence, confidentiality elections, owner and sign-off records; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."
