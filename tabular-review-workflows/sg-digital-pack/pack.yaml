description: 'Tabular review workflows for Singapore digital-regulation practice: DPIA and cross-border transfer assessment under the Personal Data Protection Act 2012 (PDPA) with PDPC guidance, privacy notice and consent flow review, AI governance readiness anchored on IMDA''s Model AI Governance Frameworks and AI Verify, regulator consultation response drafting (IMDA, PDPC, AGC, ministries), regulatory horizon scanning and obligation mapping over SSO and Gazette instruments, and online-safety obligation mapping under the Broadcasting Act online-safety part introduced by the Online Safety (Miscellaneous Amendments) Act 2022. Original work by the contributor; every workflow produces drafts for human review.'
