$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Framework Trigger & Fit
  format: tag
  tags:
  - Model AI Governance Framework (2nd Ed) — traditional AI
  - Model AI Governance Framework for Generative AI
  - Model AI Governance Framework for Agentic AI
  - Sector regulator overlay (MAS/MOH/PDPC/other)
  - AI Verify / assurance engagement intended
  - Out of scope — supported nexus analysis
  - Not assessed
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Identify applicable traditional, generative or agentic Model AI Governance Framework texts and versions, the evidenced Singapore nexus and any sector overlay. Determine force and applicability from the current identified source with pinpoint; separate guidance from binding rules. Determine any AI Verify or assurance engagement from supplied records and cited scheme scope. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 1
  name: System Description & Nexus to SG
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Describe the AI system: purpose, model type (traditional ML, GenAI, agentic), level of autonomy (read-only / controlled write / full access), training approach (build, fine-tune, third-party API), and the SG nexus — offered to SG users, processed SG data, operated from SG, or deployed by an SG entity. State expressly whether the organisation positions itself as provider, deployer, or both under IMDA''s framework terminology, and whether the system is agentic (multi-step tool-using) — which changes which framework applies. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 2
  name: Agentic-AI Agency-Level Calibration
  format: tag
  tags:
  - L0/L1 — Assisted/supervised agency (human-initiated, read-only)
  - L2 — Conditional agency (controlled write with human approval)
  - L3 — Conditional agency (broader write, bounded)
  - L4 — Advanced agency (autonomous within guardrails)
  - L5 — Full agency (minimal human intervention)
  - Not agentic — standard GenAI or predictive system
  - Not assessed
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Determine the agency taxonomy and governance pathway from the identified current Agentic AI framework passage and cite it. Calibrate only using supplied autonomy, tool-use and execution evidence. Do not treat the display tags as proof of a level or definition; return Not assessed if the taxonomy or inputs cannot be established. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 3
  name: Accountability & Ownership Map
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Map evidenced decision rights, named owners, internal/external development-chain responsibilities and escalation records. Determine meaningful-human-accountability expectations from the identified applicable framework passage with pinpoint. Distinguish documented assignments from proposed roles and unassessed ownership. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 4
  name: Risk Assessment & Impact Calibration
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Assess supplied risk assessments, dimensions, populations and controls. Determine risk-calibration expectations from identified framework passages and any AI Verify source, including coverage and limits. Label additional model-output, hallucination or adversarial-risk checks as assessments or proposals rather than unverified scheme requirements. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 5
  name: Alignment with AI Verify Testing
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Identify the current AI Verify testing-framework version and test-coverage passages and determine which principles, model types and tests it covers or excludes. Cite the identified source; do not assume blanket traditional/GenAI coverage. Determine any assurance pilot or GenAI Starter Kit requirements and resulting evidence from the current identified scheme source. Compare only supplied evaluation and engagement records. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 6
  name: Data Governance & Personal Data Compliance
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Assess data practices against the PDPA and the SG frameworks'' data-governance chapters: consent or other lawful basis for personal data in training/inference, purpose limitation and notification under PDPA, data-quality and bias-in-training-data controls, provenance of datasets (licence chain for third-party data), retention and deletion, and protection against data leakage through prompts/outputs. Flag where the framework''s recommendation exceeds PDPA minimums — noting the frameworks are not law and the gap is governance risk, not breach exposure. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 7
  name: Transparency & User Communication
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Identify the current dated Transparency Guidelines for Generative AI Chatbots and cite the relevant passages before determining any disclosure recommendation. Assess AI-interaction, capability/limitation and synthetic-content disclosures only against that identified source and any separately cited sector or Consumer Protection (Fair Trading) Act provision. Distinguish binding duties from recommendations and proposed communications. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 8
  name: Security & Incident Response
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Assess the security controls expected for the system tier: prompt-injection and adversarial robustness, model and data access controls, supply-chain security for third-party models, monitoring for anomalous or unsafe behaviour post-deployment (continuous monitoring expectations in the Agentic framework), an incident-response plan with internal escalation thresholds, and any notifiable-data-breach obligations under the PDPA if incidents involve personal data. Note security expectations that are stricter for higher agency levels. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 9
  name: Documentation & Evidence Pack
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Inventory supplied system descriptions, model cards, risk/testing records, data provenance, incident/monitoring records, policies, approvals and transparency statements. Mark HELD only with a supplied record, Not found for missing evidence, and TO BUILD only as a proposal. Determine evidence requirements for AI Verify or an assurance scheme from the identified current source with pinpoint, not an assumed assessor preference. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 10
  name: Organisational AI Governance Maturity
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Assess the organisation-level layer the SG frameworks expect: an internal AI governance policy or committee with defined escalation thresholds, staff AI literacy and training, an inventory of AI systems and their owners, procurement standards for third-party AI, and consequence frameworks for staff who act outside policy. State what exists today, what the gap is against framework expectations, and whether the gap affects only reputation or also supervisory relationships (e.g. in regulated sectors). Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 11
  name: Sector & Adjacent Regulatory Overlay
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Determine which sector or adjacent rules apply to the supplied system facts. Check identified current PDPC, MAS, MOH/Health Sciences Authority and IMDA sources and any automated-decision licensing/liability provisions. Cite each binding instrument and applicable provision; distinguish FEAT or other supervisory guidance from law and do not presume that a named regulator’s rules bind the use case. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 12
  name: Gap Analysis & Remediation Plan
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Compare evidenced practice with identified cited frameworks, sector rules and AI Verify scope/expectations. Label legal gaps separately from governance assessments; propose severity, remediation and owner/target only with stated rationale. Determine prerequisites for assurance and any deferral limits from the identified scheme source; do not decide risk acceptance. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 13
  name: Assurance & External-Comms Readiness
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. Determine permitted alignment, assurance and certification claims from the identified current framework or assurance-scheme source and cite the passage. Keep certification distinct from alignment; do not assert that all frameworks or schemes certify or do not certify. Assess readiness against supplied evidence and label draft public claims as proposals for human approval. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 14
  name: Confidence & Open Questions
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied system inventories, architecture, risk assessments, evaluation records, governance policies and approval records; do not treat a single system document as an organisation-wide inventory. State confidence (high/medium/low) for the framework fit, agency-level calibration, and each remediation priority. List open questions: facts needed from engineering on model provenance or guardrails, pending framework updates (IMDA frameworks evolve — verify the current version and date before citing), sector-regulator expectations still forming, and any planned external assurance engagement. Where a framework version or SG regulator position is checkable against an official source, verify before answering; otherwise flag explicitly. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
