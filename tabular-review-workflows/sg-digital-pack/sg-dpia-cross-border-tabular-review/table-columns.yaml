$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: PDPA Application & Role Mapping
  format: text
  prompt: 'Confirm the PDPA applies and map roles: whether the organisation is an organisation covered by s 4 (including whether it has a presence in Singapore — the PDPA has extra-territorial reach where processing relates to goods/services provided to individuals in Singapore, s 2(1A)), and whether the entity acts as data controller, data intermediary (processor), or both. State the PDPC''s position on intermediaries'' direct obligations and identify the accountable organisation for each data flow. If personal data belongs to an individual outside Singapore, assess whether the PDPA''s Singapore-nexus limb catches it.'
- index: 1
  name: Processing Inventory & Lawful Basis
  format: text
  prompt: 'Describe the processing: purpose(s), data categories and any NRIC/other national-identification number use (which PDPC guidance restricts), data subjects, volume, sources, retention and deletion. State the consent or exception basis under PDPA Part IV for each purpose — consent (s 14) or one of the exceptions in the First and Second Schedules (including legitimate interests in the Second Schedule for business improvement purposes, s 18 read with the Schedule) — and whether the consent/exception analysis is documented per PDPC''s approach. Flag any purpose that changed after collection without fresh consent or an applicable exception.'
- index: 2
  name: DPIA Necessity & PDPC Alignment
  format: tag
  tags:
  - DPIA warranted — high-risk/novel/large-scale processing
  - DPIA exists and follows PDPC DPIA framework
  - DPIA exists but outdated or incomplete
  - DPIA not warranted — routine processing
  - Sector overlay requires PIA (e.g. healthcare/finance codes)
  prompt: 'Assess whether a DPIA is warranted under PDPC''s expectations: the PDPA does not impose a blanket DPIA duty, but PDPC''s advisory guidelines and DPIA framework recommend one for processing that is novel, high-risk, large-scale, involves sensitive data or vulnerable individuals, uses new technology, or involves significant cross-border transfer. Tag whether a DPIA is warranted, whether one exists, and whether it follows the PDPC DPIA framework (initiate → assess → identify risks → evaluate → mitigate → sign-off).'
- index: 3
  name: Transfer-Limitation Obligation (s 26)
  format: text
  prompt: 'Assess compliance with s 26 PDPA (transfer limitation): for each transfer of personal data out of Singapore, confirm the organisation has taken ''reasonable steps'' to ensure the recipient is bound by obligations comparable to the PDPA, except where an exception applies. Apply PDPC''s current position — Singapore no longer prescribes a whitelist of adequate destinations; comparability is assessed case-by-case, and PDPC recognises mechanisms including contractual terms and binding corporate rules (with model contractual clauses and guidance available). State for each transfer which mechanism is relied on, whether it is actually in force, and how ''comparable protection'' is evidenced rather than assumed.'
- index: 4
  name: Recipient Comparability & Destination Risk
  format: text
  prompt: 'For each recipient jurisdiction, assess whether protection there is comparable to the PDPA: the destination''s own data-protection law and enforcement record, government-access powers, and the recipient''s practical compliance capability. Where destination protection is weaker or unverifiable, state the supplementary measures needed to reach comparability (stronger contract terms, encryption, access restrictions, data localisation for the sensitive subset) and flag any transfer where ''reasonable steps'' cannot credibly be shown.'
- index: 5
  name: Consent, Notification & Purpose Limitation
  format: text
  prompt: 'Assess consent and notice compliance under PDPA ss 13–20: consent obtained before or at collection with the purposes notified, the notice''s content and timing (s 20 — inform of purposes on or before collection), withdrawal-of-consent mechanics (s 16), and the purpose-limitation rule (s 18). Check notification of third-party disclosures and any transfer notification practice the organisation follows. Flag consents that are bundled, inferred without a reasonable basis, or stale relative to current purposes, and state the exception basis if consent is not relied on.'
- index: 6
  name: Data-Intermediary & Vendor Chain
  format: text
  prompt: 'Map data intermediaries and foreign processors (cloud hosts, SaaS vendors, analytics, support teams): each vendor''s role, whether processing is on the organisation''s documented instructions, contractual allocation of PDPA obligations, and the organisation''s continuing accountability for breaches by intermediaries (the organisation remains accountable for compliance of data it controls even when an intermediary processes it, subject to the intermediary''s own obligations under s 4(3) as amended). Identify vendors processing without written data-protection terms.'
- index: 7
  name: Security & Breach Notification
  format: text
  prompt: 'Assess protection obligations under s 24 (reasonable security arrangements) — including PDPC''s guidance on reasonable security for the data type and scale — and Part VIA breach notification: the notification duty to PDPC and affected individuals of notifiable data breaches under the Data Protection (Notification) Regulations (assessment of significance, notification within the prescribed timeline, and the exceptions). State the organisation''s incident-detection capability, its breach-severity assessment process, and whether it could meet the notification deadline for a breach in a foreign hosting location.'
- index: 8
  name: Access, Correction & Care Obligations
  format: text
  prompt: 'Assess the data-subject rights operationalisation under PDPA: access (s 21) and correction (s 22) requests — response timelines under the Regulations, permitted refusal grounds, and fee practices — plus the care obligation (s 24) for accuracy and completeness where the data is used to make decisions or is disclosed. Assess whether request handling covers data held by foreign processors and whether deletion or anonymisation is available where retention is no longer needed (note the PDPA has no general erasure right; check the exceptions and sector rules).'
- index: 9
  name: DPIA Risk Register (PDPC framework)
  format: text
  prompt: 'Populate the DPIA risk register in PDPC''s framework terms: for each processing activity, the risks to individuals (unauthorised access, misuse, disclosure, financial or reputational harm), likelihood and impact ratings, existing controls, and residual risk. Include risks arising specifically from cross-border processing (access by foreign authorities, weaker recipient environment, loss of oversight). State each risk''s owner and the treatment decision (mitigate / accept / avoid / transfer).'
- index: 10
  name: Mitigations & Supplementary Measures
  format: text
  prompt: 'List the mitigations implemented or planned for each risk above the acceptable level: technical controls (encryption, access control, logging, pseudonymisation), organisational controls (policies, training, incident response, vendor management), and transfer-specific measures (contractual comparability clauses, restrictions on recipient subprocessing, localisation of the highest-risk data). For each measure state status (live / planned / owned by whom) and whether it responds to a PDPA obligation or is PDPC-guidance best practice.'
- index: 11
  name: Accountability Documentation & Governance
  format: text
  prompt: 'Audit the accountability layer: the DPIA document, consent and notice records, a data-protection policy and named data-protection officer (organisations must appoint a DPO and make their contact information public under PDPC guidance), records of vendor due diligence, transfer records, and training evidence. Identify what a PDPC investigation would request first (consent records, notification evidence, transfer documentation, security measures, DPO records) and whether each exists and is current.'
- index: 12
  name: Gap Analysis & Remediation Plan
  format: text
  prompt: 'Consolidate gaps into a remediation plan: each gap with severity (critical — breach of the PDPA or transfer-limitation obligation; material — PDPC enforcement likely; minor — hygiene), the PDPA section engaged, the owner, the action, and a target date. Prioritise transfer legs lacking comparability evidence and consent/notice gaps ahead of documentation polish. State gaps that require architectural change and the interim risk treatment.'
- index: 13
  name: Sign-Off, Review Triggers & Residual Risk
  format: text
  prompt: 'Record the DPIA sign-off (who approved and when — the accountable organisation and DPO), residual risks accepted, and the review triggers: new purpose, new recipient or destination, new vendor, PDPA amendment or PDPC guidance change (PDPC guidance evolves regularly), material incident, or scheduled review. State the maximum review period and the trigger for regulator engagement (PDPC consultation where high residual risk is accepted).'
- index: 14
  name: Confidence & Open Questions
  format: text
  prompt: 'State confidence (high/medium/low) for the s 26 analysis, consent basis, and each critical gap. List open questions: facts needed from the business on actual flows and vendor subprocessing, and points where PDPC guidance or the PDPA''s current text must be verified against an official source (SSO/AGC for the Act, PDPC website for guidelines and the DPIA framework). Where a provision or guidance is checkable, verify before answering; otherwise mark explicitly.'
