$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Document & Flow Identification
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Identify the supplied notice/version/date, covered touchpoints and evidenced consent mechanisms and issuing entity roles. Apply the s 4 exclusions and the organisation definition in s 2(1). Do not describe s 4 as a goods-or-services territorial rule. Determine the Singapore nexus from evidence and flag imported GDPR wording without treating it as Singapore law. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 1
  name: Purpose Notification Content (s 20)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Assess purpose-notification content and timing under s 20 and consent separately under s 14, citing current provisions and any identified PDPC guidance passage for specificity or validity tests. Compare notified purposes with supplied processing evidence; do not infer actual purposes or timing from notice wording alone. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 2
  name: Consent Basis & Validity (s 14)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. For each evidenced collection, use or disclosure, identify consent under s 14, deemed consent under s 15, or deemed consent by notification under s 15A, subject to the applicable conditions. Identify the applicable exception under s 17 and the relevant Schedule: legitimate interests under First Schedule Part 3, or business improvement under the applicable provisions of the Second Schedule. Check each exception’s conditions separately. Determine each consent validity test from the identified current statutory or PDPC passage and cite it; do not attribute freely given, informed, specific or unambiguous tests without that source. Flag unsupported or mismatched bases. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 3
  name: Third-Party Disclosures & Sharing
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Compare evidenced recipients with notice and consent wording. Determine the basis for each intermediary processing activity or independent disclosure under identified PDPA provisions and cited PDPC guidance. Do not assume intermediary processing dispenses with fresh consent solely from the vendor label or contract. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 4
  name: Marketing & Direct-Messaging Consent
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Assess evidenced marketing and messaging channels, consent records, bundling and opt-outs. Determine applicable PDPA marketing/Do Not Call and Spam Control Act requirements and any ease-of-withdrawal guidance from current identified cited sources; do not prescribe an imported consent-validity test. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 5
  name: Consent Withdrawal & Deemed-Consent Analysis
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Assess withdrawal under s 16, including reasonable notice, the consequences explained to the individual and cessation of collection, use or disclosure unless otherwise required or authorised by law. Assess notification of purposes separately under s 20. Compare each notified withdrawal route with supplied flow captures and logs. Map evidenced cessation or continued processing to each purpose and cited basis; do not assume operational effectiveness. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 6
  name: Notice Accessibility & Placement
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Assess notice placement, timing, layering, accessibility and language from supplied dated user-journey captures. Derive requirements and good-practice benchmarks from identified PDPA and PDPC passages; distinguish a text defect from an evidenced operational failure and avoid predicting regulator spot-check outcomes. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 7
  name: Sensitive Data & Special Contexts
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. For health, financial, biometric, NRIC, other national-identification numbers and children’s data, determine applicable requirements and recommendations from identified current PDPC and sector sources with pinpoints. For NRIC reconcile dated guidance with current advisory/enforcement developments before stating restrictions. Compare the supplied notice and operational evidence; do not infer a heightened consent requirement from sensitivity alone. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 8
  name: Cross-Border Transfer Disclosure
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Assess compliance with s 26 and the prescribed requirements in Part 3 of the Personal Data Protection Regulations 2021, including the required comparable standard of protection and the applicable legally enforceable obligation or exception. Do not assert a former prescribed-whitelist regime. Compare notice wording with supplied transfer maps and recipient protection evidence. Determine separately from cited authority any required notice content on destinations or mechanisms, and label proposed wording; do not use an APP-style reasonable-steps test. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 9
  name: Access, Correction & Complaint Rights Disclosure
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Assess notice wording on access (s 21), correction (s 22), complaints and DPO contacts. Derive DPO appointment, public-contact and request-handling duties from cited current statutory/regulatory provisions and distinguish PDPC guidance. Verify working routes and response performance only from supplied tests or logs. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 10
  name: Retention, Security & Accuracy Statements
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Compare notice retention, security and accuracy statements against supplied operational evidence and current cited duties. Assess accuracy and completeness under s 23 where personal data is likely to be used to make a decision affecting the individual or disclosed to another organisation. Assess reasonable security arrangements separately under s 24. Assess overstatements and missing information against separately cited PDPC or consumer-law sources, not an assumed enforcement outcome. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 11
  name: Clause-by-Clause Redline
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Produce a clause-by-clause review of the notice text: for each clause, state what it says (quote), the PDPA/PDPC issue it raises, its severity (critical non-compliance / material risk / drafting improvement), and a concrete redline suggestion. Preserve the document''s numbering and structure in the review. Where a clause is compliant, say so briefly with the reason, so the review reads as a complete audit rather than a list of complaints. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 12
  name: Consent-Flow Walkthrough
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Describe each evidenced user-journey step from sign-up through notice exposure, choice, settings and withdrawal using supplied dated captures or test records. Record actual defaults and collection timing without calling them consent-respecting. Determine applicable default/choice and withdrawal benchmarks from identified cited PDPA/PDPC passages; do not prescribe universal opt-in defaults. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 13
  name: Gap Analysis & Remediation Plan
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. Propose a remediation plan with the evidenced gap, cited duty or guidance, assessed severity and rationale, evidenced owner/date or expressly proposed role/target. Use demonstrated harm, applicable legal requirements, control evidence and deadline proximity, not unsupported enforcement likelihood or informal hygiene labels. Identify architecture changes and proposed interim mitigation. Keep notice redlines and flow/engineering changes as proposals for human review. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 14
  name: Confidence & Open Questions
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied notices and dated flow captures, processing/recipient inventories, request and withdrawal logs and control evidence; a notice alone cannot establish actual practice or a working channel. State confidence (high/medium/low) for each finding and the overall compliance posture. List open questions: facts needed from the business (actual data flows, recipient list, withdrawal mechanics), PDPC guidance positions that may have evolved (verify against PDPC''s current advisory guidelines), and any provision of the PDPA whose current text should be verified against Singapore Statutes Online. Where a provision or guideline is checkable, verify before answering; otherwise mark explicitly. Do not import GDPR standards as PDPA requirements. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
