$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Document & Flow Identification
  format: text
  prompt: 'Identify the documents and flows under review: privacy policy / notice version and date, the collection touchpoints it covers (web forms, app onboarding, account creation, SDK/third-party collection, offline), and the consent mechanisms in use (checkbox, opt-in settings, implied by continued use, notice-and-consent banners). State which PDPA-regulated entity or data intermediary issues the notice and confirm the PDPA applies (s 4), including the extra-territorial limb where processing relates to individuals in Singapore. Flag any document that is a GDPR-style notice being used for Singapore without adaptation.'
- index: 1
  name: Purpose Notification Content (s 20)
  format: text
  prompt: 'Assess each notice''s statement of purposes: are the purposes of collection, use and disclosure notified on or before collection (s 20), described at a level of specificity PDPC accepts (''reasonably specific'' purposes rather than vague or boilerplate categories), and in language a reasonable Singapore user understands? Identify purposes actually pursued that are not notified, and purposes notified so broadly they would not inform real consent. Distinguish the notification duty (s 20) from the consent duty (s 14) and state where each is or is not met.'
- index: 2
  name: Consent Basis & Validity (s 14)
  format: text
  prompt: 'For each collection, use and disclosure, identify the basis relied on: consent (s 14), deemed consent by voluntary provision of data with notice (s 15), deemed consent by notification-and-opt-out for specified purposes (Second Schedule items read with s 15A-15B as applicable), or a consent exception in the First/Second Schedules (including the business-improvement exception in the Second Schedule and the s 17 read with the Schedule). Assess whether each basis is validly established on the facts — whether consent was freely given (no material detriment or bundled coercion), informed (notified purposes), specific (not a blanket authorisation), and unambiguous. Flag reliance on consent where the actual basis is an exception and vice versa.'
- index: 3
  name: Third-Party Disclosures & Sharing
  format: text
  prompt: 'Assess how the notice and consent architecture handle disclosures to third parties: are each of the categories of recipients (service providers/data intermediaries, group companies, advertising and analytics partners, government bodies on request) disclosed with enough specificity, and is consent or an exception established for each disclosure? Distinguish processing by a data intermediary (which does not require fresh consent where the controller remains accountable and the intermediary acts on instructions) from disclosures to independent third parties (which require consent or an exception). Flag undisclosed or generically described recipient categories.'
- index: 4
  name: Marketing & Direct-Messaging Consent
  format: text
  prompt: 'Assess consent mechanics for marketing and direct messaging to Singapore numbers: whether the consent basis for marketing messages is explicit and evidenced, how opt-outs and withdrawal are operationalised for each channel (email, SMS/WhatsApp-type messaging, push), and how the flow interacts with the Spam Control Act 2007 (where applicable to electronic messages) — noting the regimes are separate and both may apply. State whether marketing consent is bundled with non-marketing consent in a way PDPC would treat as not freely given, and whether withdrawal routes are at least as easy as sign-up.'
- index: 5
  name: Consent Withdrawal & Deemed-Consent Analysis
  format: text
  prompt: 'Assess withdrawal compliance (s 16): does the notice and flow tell individuals they may withdraw consent and how (s 20(3)(c) expectation), is the withdrawal mechanism operational across channels, and what happens to data after withdrawal — does processing stop within a reasonable time except where continued use is permitted by an exception (e.g. legal obligation)? Map each purpose to what the organisation would do on withdrawal and flag any purpose that would continue without a lawful basis.'
- index: 6
  name: Notice Accessibility & Placement
  format: text
  prompt: 'Assess whether notices are accessible at the point and time PDPC expects: is the notice presented on or before collection rather than buried in terms of service, is it reachable in the user journey (pre-tick or at-collection links, settings screens), is the full privacy policy reasonably findable and current, and is material information in plain language? Assess the layering approach (short-form notice at collection plus full policy) against PDPC''s guidance on good notice practice and flag placements that would fail a spot-check by a regulator or an average user.'
- index: 7
  name: Sensitive Data & Special Contexts
  format: text
  prompt: 'Where the flow involves sensitive or high-risk data (health, financial, biometric, NRIC or other national identification numbers, children''s data), assess whether the notice and consent approach meets the heightened expectations: PDPC''s advisory guidelines on NRIC use (collection restricted to situations required by law or where necessary for accurate identification), biometric-data guidance, and any sector rules (healthcare, finance). State whether the notice adequately discloses the sensitivity handling and whether consent is obtained where the data type requires it.'
- index: 8
  name: Cross-Border Transfer Disclosure
  format: text
  prompt: 'Assess how the notice handles cross-border transfer: does the organisation inform individuals that data is transferred overseas and on what basis (s 26 transfer-limitation compliance — recipient bound by comparable protection, contractual or BCR mechanisms), and does the notice content support the s 26 ''reasonable steps'' story? State whether any disclosure of transfer destinations or mechanisms is missing, vague, or inconsistent with the actual transfer map, and flag whether transfer notices are framed accurately (the PDPA does not require a destination whitelist; it requires the comparability assurance).'
- index: 9
  name: Access, Correction & Complaint Rights Disclosure
  format: text
  prompt: 'Assess whether the notice discloses the rights and channels the PDPA requires in practice: the right to access (s 21) and correct (s 22) personal data, how to make such requests, the organisation''s complaint-handling route (including PDPC''s expectation of a responsive complaints process), and the DPO contact (organisations must appoint a DPO and make contact information available per PDPC guidance). State whether the notice gives a working contact route and whether request handling would meet the response timelines in the Regulations.'
- index: 10
  name: Retention, Security & Accuracy Statements
  format: text
  prompt: 'Assess the notice''s statements on retention, security and accuracy: whether the organisation states retention periods or the criteria used (and whether statements match practice), describes security measures at a level that is honest without over-promising, and addresses the care obligation (s 24) on accuracy for data used in decisions. Flag overstatements (e.g. ''fully secure'', ''never shared'') that create enforcement or consumer-law risk, and understatements that fail PDPC''s transparency expectations.'
- index: 11
  name: Clause-by-Clause Redline
  format: text
  prompt: 'Produce a clause-by-clause review of the notice text: for each clause, state what it says (quote), the PDPA/PDPC issue it raises, its severity (critical non-compliance / material risk / drafting improvement), and a concrete redline suggestion. Preserve the document''s numbering and structure in the review. Where a clause is compliant, say so briefly with the reason, so the review reads as a complete audit rather than a list of complaints.'
- index: 12
  name: Consent-Flow Walkthrough
  format: text
  prompt: 'Walk through the actual user journey of each consent flow end-to-end as a Singapore user would experience it (sign-up → notice exposure → consent decision → settings → withdrawal): note what the user sees at each step, where notice appears relative to collection, whether the default settings are consent-respecting (opt-in defaults for non-essential processing), and whether withdrawal is as easy as grant. Identify steps where the flow would fail PDPC''s expectations or a regulator''s user-journey audit.'
- index: 13
  name: Gap Analysis & Remediation Plan
  format: text
  prompt: 'Consolidate findings into a remediation plan: each gap with severity (critical — PDPA breach likely; material — enforcement or complaint risk; minor — hygiene), the PDPA section or PDPC guidance engaged, the owner, the fix (notice rewording, flow change, engineering change, process change), and a target date. Prioritise gaps in existing live flows over new-document polish. State any gap that requires legal advice beyond this review or a product decision.'
- index: 14
  name: Confidence & Open Questions
  format: text
  prompt: 'State confidence (high/medium/low) for each finding and the overall compliance posture. List open questions: facts needed from the business (actual data flows, recipient list, withdrawal mechanics), PDPC guidance positions that may have evolved (verify against PDPC''s current advisory guidelines), and any provision of the PDPA whose current text should be verified against Singapore Statutes Online. Where a provision or guideline is checkable, verify before answering; otherwise mark explicitly. Do not import GDPR standards as PDPA requirements.'
